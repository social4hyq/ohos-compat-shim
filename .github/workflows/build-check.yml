name: Build check

# Compile-only check for pull requests: cross-compiles every target with the
# OHOS NDK clang on a stock x86 runner. Nothing is signed or executed here
# (the cloud runner cannot run OHOS binaries); on-device checks stay in
# release.yml and `make functional` / `make ghost`.

on:
  pull_request:
    paths:
      - src/**
      - test/**
      - Makefile
      - .github/workflows/build-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0

      - name: make (library, tests and diagnostics)
        run: make OHOS_NDK_HOME="${OHOS_SDK_NATIVE}" all
