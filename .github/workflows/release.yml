name: Release

# Fully cloud-built: no Homebrew formula, no self-hosted build runner. A
# GitHub-hosted x86 runner cross-compiles libohos_compat.so with the OHOS
# NDK clang and self-signs it with ohos-selfsign's self-sign.py (the
# device-only binary-sign-tool/ohos-signpost don't run on a stock cloud
# runner). The cloud runner can't execute an OHOS binary, and this repo has no
# self-hosted device runner, so the real-device check is the pre-release
# `make smoke` / `make functional` run on a device. The smoke-test job below
# is opt-in (manual dispatch) for when a device runner is registered.

on:
  release:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      device_smoke:
        description: Run the smoke test on a self-hosted device runner
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64-unknown-linux-ohos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0

      - name: Build libohos_compat.so + smoke test binary
        run: |
          make OHOS_NDK_HOME="${OHOS_SDK_NATIVE}" libohos_compat.so test/smoke
          file libohos_compat.so test/smoke

      - name: Self-sign both artifacts
        run: |
          python3 scripts/ohos/self-sign.py libohos_compat.so
          python3 scripts/ohos/self-sign.py test/smoke
          chmod +x libohos_compat.so test/smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ohos-compat-shim-aarch64-unknown-linux-ohos
          path: |
            libohos_compat.so
            test/smoke

  smoke-test:
    name: Real-device smoke test
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.device_smoke
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ohos-compat-shim-aarch64-unknown-linux-ohos

      - name: Baseline (no shim) — expected to show the known HM sandbox failures
        run: |
          chmod +x ./test/smoke
          ./test/smoke || true

      - name: With LD_PRELOAD — all three checks must pass
        run: |
          LD_PRELOAD="$(pwd)/libohos_compat.so" ./test/smoke

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ohos-compat-shim-aarch64-unknown-linux-ohos

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: libohos_compat.so
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish @ohos-ports/compat-shim
    needs: build
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable PUBLISH_NPM=true and the NPM_TOKEN
    # secret. Skipped by default; the package has never been published.
    if: github.event_name == 'release' && vars.PUBLISH_NPM == 'true'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ohos-compat-shim-aarch64-unknown-linux-ohos
          path: lib

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Prune smoke test binary from the npm payload
        run: rm -rf lib/test

      - name: Set the package version from the release tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
